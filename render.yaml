services:
  - type: web
    name: toko-digital
    runtime: node
    plan: starter # SQLite di disk persisten butuh plan berbayar (free plan tidak punya disk)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORE_NAME
        value: Toko Digital
      - key: WHATSAPP_NUMBER
        sync: false
      - key: BASE_URL
        sync: false
      - key: PAYMENT_PRIORITY
        value: midtrans,xendit
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"
      - key: XENDIT_SECRET_KEY
        sync: false
      - key: XENDIT_CALLBACK_TOKEN
        sync: false
      - key: DIGIFLAZZ_USERNAME
        sync: false
      - key: DIGIFLAZZ_API_KEY
        sync: false
      - key: SUPPLIERS_JSON
        sync: false
      - key: VIPRESELLER_API_ID
        sync: false
      - key: VIPRESELLER_API_KEY
        sync: false
      - key: TOKOVOUCHER_MEMBER_CODE
        sync: false
      - key: TOKOVOUCHER_SECRET
        sync: false
      - key: APIGAMES_MERCHANT_ID
        sync: false
      - key: APIGAMES_SECRET
        sync: false
      - key: RELOADLY_CLIENT_ID
        sync: false
      - key: RELOADLY_CLIENT_SECRET
        sync: false
      - key: RELOADLY_FALLBACK_EMAIL
        sync: false
      - key: DINGCONNECT_API_KEY
        sync: false
      - key: FONNTE_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RELOADLY_SANDBOX
        value: "true"
